<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404 - Page Not Found | Syncy</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- AOS CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            overflow: hidden; /* Prevent scrolling on 404 page */
            background-color: #f8fafc; /* Light background */
        }
        
        .error-page-wrapper {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 1;
        }

        .error-shape-1 {
            position: absolute;
            top: -10%; left: -10%;
            width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(37,99,235,0.1) 0%, rgba(37,99,235,0) 70%);
            z-index: -1;
            animation: float 8s ease-in-out infinite;
        }

        .error-shape-2 {
            position: absolute;
            bottom: -10%; right: -10%;
            width: 40vw; height: 40vw;
            background: radial-gradient(circle, rgba(12,74,255,0.08) 0%, rgba(12,74,255,0) 70%);
            z-index: -1;
            animation: float 10s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
        }

        .error-content {
            padding: 40px;
        }

        .error-code {
            font-size: clamp(8rem, 15vw, 12rem);
            font-weight: 800;
            color: #0f172a; /* Dark text for '4's */
            margin: 0;
            line-height: 1;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .error-code span {
            display: inline-block;
            animation: bounce 2s infinite;
        }

        .error-code span:nth-child(2) { animation-delay: 0.2s; color: #0c4aff; }
        .error-code span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-30px); }
            60% { transform: translateY(-15px); }
        }

        .error-title {
            font-size: 2rem;
            color: #0f172a; /* Dark text */
            margin-top: 20px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .error-desc {
            font-size: 1.1rem;
            color: #64748b;
            max-width: 500px;
            margin: 0 auto 40px;
            line-height: 1.6;
        }

        .error-actions {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .error-actions .btn {
            padding: 14px 28px;
            font-weight: 700;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            transition: all 0.3s;
            cursor: pointer;
        }

        .btn-primary {
            background-color: #0c4aff;
            color: #fff;
            border: none;
        }

        .btn-primary:hover {
            background-color: #093bc2;
            transform: translateY(-2px);
        }

        .btn-outline {
            background-color: transparent;
            color: #0f172a; /* Dark text */
            border: 1px solid #0f172a; /* Dark border */
        }

        .btn-outline:hover {
            background-color: rgba(15,23,42,0.05); /* Light hover effect */
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="error-page-wrapper">
        <div class="error-shape error-shape-1"></div>
        <div class="error-shape error-shape-2"></div>
        
        <div class="error-content" data-aos="zoom-in" data-aos-duration="1000">
            <h1 class="error-code">
                <span>4</span>
                <span>0</span>
                <span>4</span>
            </h1>
            <h2 class="error-title">Oops! Page not found.</h2>
            <p class="error-desc">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
            
            <div class="error-actions" data-aos="fade-up" data-aos-delay="300">
                <button onclick="window.history.back()" class="btn btn-outline">
                    <i class="fas fa-arrow-left"></i> Go Back
                </button>
                <a href="index.html" class="btn btn-primary">
                    <i class="fas fa-home"></i> Back to Home
                </a>
            </div>
        </div>
    </div>

    <!-- AOS Script -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            once: true,
            offset: 50,
        });
    </script>
</body>
</html>
