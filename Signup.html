<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Syncy</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow-x: hidden;
        }

        /* Complex background matching the screenshot */
        .auth-background {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #030614; /* Deep space black */
            z-index: -2;
        }

        /* Starry background */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.3;
            z-index: -2;
            animation: twinkle 5s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; }
            100% { opacity: 0.5; }
        }

        /* Center Blue Glow */
        .blue-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 120vh;
            background: radial-gradient(ellipse at center, rgba(37, 99, 235, 0.8) 0%, rgba(29, 78, 216, 0.4) 40%, transparent 70%);
            z-index: -1;
            opacity: 0.9;
        }

        /* Slanted Stripes */
        .stripes {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                75deg,
                rgba(255, 255, 255, 0.03) 0%,
                rgba(255, 255, 255, 0.03) 50px,
                transparent 50px,
                transparent 100px
            );
            z-index: -1;
        }

        /* Page Layout */
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
        }

        /* Back Button */
        .back-btn {
            position: absolute;
            top: 40px;
            left: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            opacity: 0.8;
            transition: opacity 0.3s;
            z-index: 10;
        }

        .back-btn:hover {
            opacity: 1;
        }

        .back-btn i {
            font-size: 1.2rem;
        }

        /* Auth Card */
        .auth-card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            padding: 50px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .auth-logo {
            margin-bottom: 40px;
            display: block;
        }

        .auth-logo img {
            height: 24px;
        }

        .auth-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .auth-subtitle {
            font-size: 0.9rem;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            height: 48px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 0 16px;
            font-size: 0.95rem;
            color: #0f172a;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-input:focus {
            border-color: #0c4aff;
        }

        .form-input::placeholder {
            color: #94a3b8;
        }

        .form-hint {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 8px;
            display: block;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            height: 48px;
            background: #1e3a8a; /* Deep blue matching screenshot */
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #1e40af;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 30px 0;
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }

        .divider:not(:empty)::before {
            margin-right: 15px;
        }

        .divider:not(:empty)::after {
            margin-left: 15px;
        }

        /* Social Login */
        .social-logins {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .social-btn {
            flex: 1;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .social-btn:hover {
            background: #f1f5f9;
        }

        .social-btn img {
            width: 20px;
            height: 20px;
        }

        /* Footer */
        .auth-footer {
            text-align: center;
            font-size: 0.9rem;
            color: #475569;
        }

        .auth-footer a {
            color: #1e3a8a;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .auth-card {
                padding: 40px 30px;
            }
            .back-btn {
                top: 20px;
                left: 20px;
                color: #ffffff;
            }
        }
    </style>
</head>
<body>

    <div class="auth-background"></div>
    <div class="stars"></div>
    <div class="blue-glow"></div>
    <div class="stripes"></div>

    <a href="javascript:history.back()" class="back-btn">
        <i class="fas fa-arrow-left"></i> Back
    </a>

    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="auth-logo">
                <img src="assets/Brand-logo.webp" alt="Stackly">
            </a>
            
            <h1 class="auth-title">Sign up</h1>
            <p class="auth-subtitle">Welcome To Stackly ! Sign up to access your account with your registered username or email address</p>

            <form action="#">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" placeholder="hi@email.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" placeholder="Password" required>
                    <span class="form-hint">At least 12 characters</span>
                </div>

                <button type="submit" class="submit-btn">Sign Up</button>
            </form>

            <div class="divider">Or sign Up with</div>

            <div class="social-logins">
                <button class="social-btn">
                    <i class="fab fa-facebook" style="color: #1877F2; font-size: 1.2rem;"></i>
                </button>
                <button class="social-btn">
                    <i class="fab fa-google" style="background: conic-gradient(from -45deg, #ea4335 110deg, #4285f4 90deg 180deg, #34a853 180deg 270deg, #fbbc05 270deg) 73% 55%/150% 150% no-repeat;
                        -webkit-background-clip: text;
                        background-clip: text;
                        color: transparent; font-size: 1.2rem;"></i>
                </button>
                <button class="social-btn">
                    <i class="fab fa-apple" style="color: #000000; font-size: 1.3rem;"></i>
                </button>
            </div>

            <div class="auth-footer">
                Already have an account? <a href="Login.html">Sign in</a>
            </div>
        </div>
    </div>

</body>
</html>
